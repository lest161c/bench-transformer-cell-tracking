# DRAFT - generated by generate_etultra_configs.py from Achard's
# origin/cy/pretrained_feats_train: scripts/sam21_aug_bacteria.yaml
# Deviations: backbone -> dynaclr-scaledcnn; added pretrained_model_path;
# data/outdir/cachedir repointed to our cluster. Blocked on T0 (bridge) + T3 (smoke).
# NOTE: deepcell_orig/train/16_corrected was mapped to deepcell/train/16; verify
# that the cluster's train/16 holds the corrected ground truth.
# Forked from zih_bacteria.yaml
name: vanvliet_sam21_aug
# model: /home/achard/trastra_v2/BEST_2025-06-04_13-23-38_vanvliet_sam21_aug
epochs: 1000
warmup_epochs: 5
window: 4
attn_dist_mode: v1
delta_cutoff: 1
num_encoder_layers: 4
num_decoder_layers: 4
causal_norm: none
d_model: 256
dropout: 0.05
pos_embed_per_dim: 32
lr: 0.0001
train_samples: 32000
max_tokens: 2048
batch_size: 55
detection_folders:
- TRA
crop_size:
- 320
- 320
attn_positional_bias: rope
ndim: 2
# Features config
features: pretrained_feats_aug
# features: pretrained_feats
# features: wrfeat
#### Additional parameters for pretrained_feats
augment: 3
pretrained_n_augs: 25
pretrained_feats_model: dynaclr-scaledcnn
pretrained_model_path: /data/cat/ws/lest161c-ssl_cell_tracking/bench-transformer-cell-tracking/benchmark_ssl/results/checkpoints/cnn_bn100k_step100000.pt
# pretrained_feats_model: facebookresearch/co-tracker
# pretrained_feats_model: weigertlab/tarrow
# pretrained_model_path: /home/achard/tarrow_runs/vanvliet_backbone_unet_delta1-2
# pretrained_feats_model: debug/encoded_labels
reduced_pretrained_feat_dim: 128
pretrained_feats_mode: mean_patches_exact
# pretrained_feats_mode: nearest_patch
pretrained_feats_additional_props: regionprops_small
# feat_embed_per_dim: 8 # Reduce additional dimensions added to the features via positional embedding
rotate_features: true
# disable_xy_coords: true
# disable_all_coords: True
cachedir: /data/cat/ws/lest161c-ssl_cell_tracking/bench-transformer-cell-tracking/.cache/etultra
outdir: /data/cat/ws/lest161c-ssl_cell_tracking/bench-transformer-cell-tracking/benchmark_ssl/results/etultra_runs/bacteria
# weight_decay: 0.01
#### Logger
logger: wandb
wandb_project: "trackastra_v2"
# Paths config
cache: true
compress: true
distributed: false
