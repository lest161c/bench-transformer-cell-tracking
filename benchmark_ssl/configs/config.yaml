# SSL Contrastive Pretraining Configuration
# Uses NT-Xent (InfoNCE) loss — SimCLR-style contrastive learning.
# Produces per-cell embeddings via ASCENT NETr-inspired encoder.

name: ssl_contrastive

# Data
data_root: ../data/vanvliet
conditions: [rpsM, recA, pheA, metA, cib, trpL]
ndim: 2

# Feature extraction (matches trackastra wrfeat regionprops2)
features: regionprops2

# Distortion families applied to each view independently
# Available: affine, elastic, jitter, dropout, photometric, feature_noise
distortions: [affine, elastic, jitter, dropout, photometric, feature_noise]

affine:
  degrees: 15
  scale: [0.85, 1.15]
  shear: [0.1, 0.1]

elastic:
  alpha: [10, 50]
  sigma: [5, 15]

jitter:
  std: [2, 8]
  p_cell_jitter: 0.8

dropout:
  p_drop: [0.05, 0.2]

photometric:
  scale: [0.5, 2.0]
  shift: [-0.1, 0.1]

feature_noise:
  std: [0.02, 0.15]

# Encoder (ASCENT NETr-inspired CellEmbedder)
encoder:
  d_model: 128
  nhead: 4
  num_layers: 4
  dim_feedforward: 256
  dropout: 0.1

# Contrastive learning
ssl:
  temperature: 0.05

# Training
training:
  batch_size: 4
  lr: 0.0003
  weight_decay: 0.01
  epochs: 5
  val_split: 0.1
  log_every: 10
  checkpoint_every: 10
