[project]
name = "benchmark_training"
version = "0.1.0"
description = "Training performance benchmarks for Trackastra (full-scale SLURM runs + local A500 benchmarks)"
requires-python = ">=3.11"
dependencies = [
  "torch",
  "torchvision",
  "numpy",
  "pandas",
  "matplotlib",
  "seaborn",
  "tifffile",
  "pyyaml",
  "lightning",
  "scikit-image",
  "edt",
  "tqdm",
  "configargparse",
  "wandb",
  "tensorboard",
  "dask",
  "joblib",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
