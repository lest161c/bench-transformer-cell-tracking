# Coordinate-free baseline: 7D regionprops features WITHOUT any positional
# encoding (labbook 2026-06-02 prescription; SPEC 0002 / T2).
#
# Exact mirror of configs/vanvliet_baseline.yaml (seed 42, crop [320,320],
# dense attention) except for the three NoPE switches marked below.  These
# remove EVERY path by which centroid coordinates reach the model:
#   - pos_embed_per_dim: 32 -> 0    disables the Fourier positional encoding
#     (TrackingTransformer substitutes a constant NoPositionalEncoding).
#   - attn_positional_bias: rope -> none    disables RoPE inside attention.
#   - attn_dist_mode: v1 -> none    disables the spatial-cutoff attention
#     mask and the distance-decay attention bias (both computed from coords).
# Requires dense attention: knn_neighbors is left unset (= -1, dense default)
# because KNN neighbour selection would itself be coordinate-based.
name: vanvliet_nope
epochs: 500
warmup_epochs: 5
augment: 3
window: 4
attn_dist_mode: none
delta_cutoff: 1
num_encoder_layers: 6
num_decoder_layers: 6
causal_norm: quiet_softmax
cachedir: runs/.cache
compress: true
d_model: 320
dropout: 0.05
pos_embed_per_dim: 0
feat_embed_per_dim: 8
lr: 0.0001
train_samples: 32000
max_tokens: 2048
batch_size: 48
detection_folders:
  - TRA
crop_size:
  - 320
  - 320
attn_positional_bias: none
features: wrfeat
mixedp: true
num_workers: 8
seed: 42

input_train:
  - /data/cat/ws/mawe985g-data/data/celltracking/vanvliet/cib/140409-03
  - /data/cat/ws/mawe985g-data/data/celltracking/vanvliet/cib/140415-08
